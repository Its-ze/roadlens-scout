name: Verify detection signatures

on:
  push:
    paths:
      - "data/signatures.json"
      - "app/public/signatures.json"
      - "scripts/verify-source-feeds.ps1"
      - ".github/workflows/update-signatures.yml"
  pull_request:
    paths:
      - "data/signatures.json"
      - "app/public/signatures.json"
      - "scripts/verify-source-feeds.ps1"
      - ".github/workflows/update-signatures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signatures:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify signature feed
        shell: pwsh
        run: .\scripts\verify-source-feeds.ps1 -Feed signatures

name: Verify camera seed map

on:
  push:
    paths:
      - "data/camera-seeds.json"
      - "app/public/camera-seeds.json"
      - "docs/camera-seeds.json"
      - "docs/site-meta.json"
      - "docs/downloads/checksums.txt"
      - "scripts/verify-source-feeds.ps1"
      - ".github/workflows/update-camera-seeds.yml"
  pull_request:
    paths:
      - "data/camera-seeds.json"
      - "app/public/camera-seeds.json"
      - "docs/camera-seeds.json"
      - "docs/site-meta.json"
      - "docs/downloads/checksums.txt"
      - "scripts/verify-source-feeds.ps1"
      - ".github/workflows/update-camera-seeds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-camera-seeds:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify camera seed feed
        shell: pwsh
        run: .\scripts\verify-source-feeds.ps1 -Feed camera-seeds
